name: CI

# T3meer — خط الاختبار (T3MER_CLICKUP_PLAN.md — تاسكة اليوم 1.3).
# بيتأكد قبل أي merge إن:
# - الـ migrations بتنفّذ على SQLite (نفس بيئة Pest) من الصفر
# - كل اختبارات الاتفاقات (0.4) خضراء
# - التحليل الساكن مفيهوش أخطاء

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} — Pest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # migrations + RefreshDatabase: بيتأكد إن الـ schema بيتبنى من الصفر
      # من غير أي trigger/stored procedure (ممنوعة في SPEC 7.1).
      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Pest
        run: vendor/bin/pest --ci

      - name: Pint (code style)
        run: vendor/bin/pint --test
        continue-on-error: true
